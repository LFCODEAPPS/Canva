<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdi · Editor de diseños</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Poppins:wght@400;700&family=Playfair+Display:wght@400;700&family=Pacifico&family=Bebas+Neue&family=Montserrat:wght@400;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
:root{--g9:#062b20;--g8:#0b3b2c;--g7:#0f5a41;--g5:#17b26a;--g4:#3fd18a;--g1:#e3f5ea;--g0:#f3fbf6;--ink:#10231b;--mut:#5d7a6c;--line:#cfe6d9;--danger:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--g1);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g4);outline-offset:2px}

header{height:56px;background:linear-gradient(90deg,var(--g9),var(--g7));color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:8px}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50% 0 50% 0;background:var(--g4);margin-right:6px}
#title{background:rgba(255,255,255,.12);border:1px solid transparent;color:#fff;border-radius:8px;padding:7px 10px;width:190px}
#title:hover,#title:focus{border-color:rgba(255,255,255,.4)}
.sp{flex:1}
.hb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:8px 11px;font-weight:600}
.hb:hover:not(:disabled){background:rgba(255,255,255,.22)}
.hb:disabled{opacity:.4;cursor:default}
.hb.main{background:var(--g5);color:#04170f}
.hb.main:hover{background:var(--g4)!important}
.menu{position:relative}
.drop{display:none;position:absolute;right:0;top:42px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(6,43,32,.3);padding:6px;min-width:210px;z-index:30}
.drop.open{display:block}
.drop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:7px;color:var(--ink)}
.drop button:hover{background:var(--g1)}
.drop hr{border:0;border-top:1px solid var(--line);margin:6px 0}

#bar{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px;flex:none;overflow-x:auto;white-space:nowrap}
#bar .hint{color:var(--mut);font-size:14px}
.grp{display:none;align-items:center;gap:6px}
.grp.on{display:flex}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 9px;font-weight:600;color:var(--g8)}
.tb:hover{background:var(--g1)}
.tb.act{background:var(--g8);color:#fff;border-color:var(--g8)}
.clr{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
input[type=range]{accent-color:var(--g5);width:90px}
select{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 6px}
#fsize{width:62px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 6px}

.body{flex:1;display:flex;min-height:0}
#rail{width:76px;background:var(--g8);display:flex;flex-direction:column;padding:8px 0;flex:none}
#rail button{background:none;border:0;color:#a9d9c1;padding:12px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;border-left:3px solid transparent}
#rail button span{font-size:22px;line-height:1}
#rail button:hover{color:#fff}
#rail button.on{color:#fff;background:var(--g7);border-left-color:var(--g4)}
#panel{width:290px;background:#fff;border-right:1px solid var(--line);padding:16px;overflow-y:auto;flex:none}
#panel h3{margin:0 0 12px;font-size:15px}
.pane{display:none}
.pane.on{display:block}
.big{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--g0);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.big:hover{border-color:var(--g5);background:var(--g1)}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shapes button{aspect-ratio:1;border:1px solid var(--line);background:var(--g0);border-radius:10px;font-size:26px;color:var(--g7)}
.shapes button:hover{border-color:var(--g5);background:var(--g1)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}
.sw button{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.drop-zone{border:2px dashed var(--g5);background:var(--g0);border-radius:12px;padding:26px 12px;text-align:center;color:var(--g7);font-weight:600;cursor:pointer}
.drop-zone.over{background:var(--g1)}
.sizes button{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:6px;color:var(--ink)}
.sizes button:hover{background:var(--g1)}
.sizes small{color:var(--mut)}
label.f{display:block;font-size:13px;color:var(--mut);margin:8px 0 5px}

/* Capas */
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;cursor:pointer;user-select:none}
.layer:hover{background:var(--g0)}
.layer.sel{border-color:var(--g5);background:var(--g1)}
.layer.drag{opacity:.4}
.layer.drop-before{box-shadow:0 -2px 0 var(--g5)}
.layer.drop-after{box-shadow:0 2px 0 var(--g5)}
.layer .ic{width:26px;height:26px;border-radius:6px;background:var(--g0);display:grid;place-items:center;font-size:14px;color:var(--g7);flex:none;overflow:hidden}
.layer .ic img{max-width:100%;max-height:100%}
.layer .nm{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .mini{border:0;background:none;padding:4px;border-radius:6px;color:var(--mut);font-size:14px;line-height:1}
.layer .mini:hover{background:var(--g1);color:var(--ink)}
.layer .mini.act{color:var(--g5)}

/* Galería multi-proyecto */
#gallery{position:fixed;inset:0;background:rgba(6,43,32,.55);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
#gallery.open{display:flex}
.gbox{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.ghead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ghead h2{margin:0;font-size:18px;flex:1}
.gbody{padding:16px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.proj{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--g0);display:flex;flex-direction:column}
.proj .thumb{aspect-ratio:1;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:12px;color:var(--mut)}
.proj .thumb img{max-width:100%;max-height:100%;object-fit:contain}
.proj .pmeta{padding:8px 10px;font-size:13px}
.proj .pmeta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .pmeta small{color:var(--mut)}
.proj .pacts{display:flex;gap:4px;padding:0 8px 8px}
.proj .pacts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px;font-size:12px;color:var(--g8)}
.proj .pacts button:hover{background:var(--g1)}
.proj .pacts button.dang{color:var(--danger)}

#ws{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative;background:radial-gradient(circle at 1px 1px,#b7dcc6 1px,transparent 0) 0 0/22px 22px,var(--g1);touch-action:none}
.canvas-container{box-shadow:0 8px 30px rgba(6,43,32,.22);margin:auto}
#zoombox{position:absolute;right:14px;bottom:14px;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(6,43,32,.2);display:flex;align-items:center;gap:6px;padding:6px 8px}
#zoombox button{border:0;background:var(--g1);width:28px;height:28px;border-radius:6px;font-weight:800;color:var(--g8)}
#zoombox span{min-width:44px;text-align:center;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--g9);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:80}
#toast.show{opacity:1;transform:translateX(-50%)}
#savestate{font-size:12px;color:#a9d9c1;margin-right:6px;white-space:nowrap}
@media(max-width:760px){
  #panel{position:fixed;left:0;top:106px;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;display:block}
  #panel.open{transform:none;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  #title{width:110px}.logo{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Verdi</div>
  <input id="title" value="Diseño sin título" aria-label="Nombre del diseño">
  <span id="savestate" aria-live="polite"></span>
  <button class="hb" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
  <button class="hb" id="redo" title="Rehacer (Ctrl+Y)">↷</button>
  <div class="sp"></div>
  <button class="hb" id="galleryBtn" title="Mis diseños">🗂 Mis diseños</button>
  <div id="auth-slot"><!-- Login de Google se añadirá aquí --></div>
  <div class="menu">
    <button class="hb main" id="dlbtn">Descargar ▾</button>
    <div class="drop" id="dl">
      <button data-f="png">PNG (alta calidad)</button>
      <button data-f="jpeg">JPG</button>
      <button data-f="svg">SVG (vectorial)</button>
      <button data-f="pdf">PDF</button>
      <hr>
      <button data-f="json">Proyecto (.json)</button>
    </div>
  </div>
</header>

<div id="bar">
  <span class="hint" id="hint">Selecciona un elemento para editarlo</span>
  <div class="grp" id="g-all">
    <label class="clr">Relleno <input type="color" id="fill" value="#17b26a"></label>
    <label class="clr">Borde <input type="color" id="stroke" value="#0b3b2c"></label>
    <select id="sw" title="Grosor del borde"><option value="0">Sin borde</option><option value="2">2 px</option><option value="4">4 px</option><option value="8">8 px</option></select>
    <label class="clr">Opacidad <input type="range" id="op" min="5" max="100" value="100"></label>
    <div class="sep"></div>
    <button class="tb" id="front" title="Traer al frente">⬆</button>
    <button class="tb" id="back" title="Enviar atrás">⬇</button>
    <button class="tb" id="dup" title="Duplicar (Ctrl+D)">⧉</button>
    <button class="tb" id="lock" title="Bloquear">🔒</button>
    <button class="tb" id="del" title="Eliminar (Supr)">🗑</button>
    <div class="sep"></div>
    <button class="tb" id="alH" title="Centrar horizontal">⇔</button>
    <button class="tb" id="alV" title="Centrar vertical">⇕</button>
    <button class="tb" id="alL" title="Alinear a la izquierda">⇤</button>
    <button class="tb" id="alR" title="Alinear a la derecha">⇥</button>
    <button class="tb" id="alT" title="Alinear arriba">⇡</button>
    <button class="tb" id="alB" title="Alinear abajo">⇣</button>
    <button class="tb" id="distH" title="Distribuir horizontal">↔</button>
    <button class="tb" id="distV" title="Distribuir vertical">↕</button>
  </div>
  <div class="grp" id="g-text">
    <div class="sep"></div>
    <select id="font" title="Fuente"></select>
    <input id="fsize" type="number" min="6" max="400" value="40" title="Tamaño">
    <button class="tb" id="bold"><b>B</b></button>
    <button class="tb" id="ital"><i>I</i></button>
    <button class="tb" id="under"><u>U</u></button>
    <button class="tb" data-al="left" title="Izquierda">≡</button>
    <button class="tb" data-al="center" title="Centro">☰</button>
    <button class="tb" data-al="right" title="Derecha">≣</button>
  </div>
</div>

<div class="body">
  <nav id="rail">
    <button class="on" data-p="text"><span>T</span>Texto</button>
    <button data-p="shapes"><span>◆</span>Formas</button>
    <button data-p="upload"><span>⇪</span>Subir</button>
    <button data-p="layers"><span>≡</span>Capas</button>
    <button data-p="bg"><span>▨</span>Fondo</button>
    <button data-p="size"><span>⤢</span>Tamaño</button>
    <button data-p="templates"><span>✦</span>Plantillas</button>
  </nav>
  <aside id="panel">
    <div class="pane on" id="p-text">
      <h3>Texto</h3>
      <button class="big" data-t="h" style="font:800 24px 'Plus Jakarta Sans'">Añadir un título</button>
      <button class="big" data-t="s" style="font:600 17px 'Plus Jakarta Sans'">Añadir un subtítulo</button>
      <button class="big" data-t="b" style="font:400 14px 'Plus Jakarta Sans'">Añadir un párrafo de texto</button>
      <h3 style="margin-top:18px">Combinaciones</h3>
      <button class="big" data-t="c1" style="font:400 22px 'Pacifico';color:#0f5a41">Hecho con cariño</button>
      <button class="big" data-t="c2" style="font:400 24px 'Bebas Neue';letter-spacing:.06em">GRAN OFERTA</button>
      <button class="big" data-t="c3" style="font:700 20px 'Playfair Display'">Elegancia clásica</button>
    </div>
    <div class="pane" id="p-shapes">
      <h3>Formas</h3>
      <div class="shapes">
        <button data-s="rect" title="Rectángulo">■</button>
        <button data-s="round" title="Rectángulo redondeado">▢</button>
        <button data-s="circle" title="Círculo">●</button>
        <button data-s="tri" title="Triángulo">▲</button>
        <button data-s="star" title="Estrella">★</button>
        <button data-s="heart" title="Corazón">♥</button>
        <button data-s="line" title="Línea">━</button>
        <button data-s="arrow" title="Flecha">➜</button>
        <button data-s="hex" title="Hexágono">⬢</button>
      </div>
    </div>
    <div class="pane" id="p-upload">
      <h3>Imágenes</h3>
      <div class="drop-zone" id="dz">Haz clic o suelta aquí tus imágenes</div>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <p style="font-size:12px;color:var(--mut);margin-top:10px">Tamaño máximo por imagen: 12 MB. Se recomienda &lt; 4000px de lado.</p>
    </div>
    <div class="pane" id="p-layers">
      <h3>Capas <small style="color:var(--mut);font-weight:400">(arrastra para reordenar)</small></h3>
      <div class="layers" id="layers"></div>
    </div>
    <div class="pane" id="p-bg">
      <h3>Color de fondo</h3>
      <div class="sw" id="swatches"></div>
      <label class="f">Color personalizado</label>
      <input type="color" id="bgc" value="#ffffff">
    </div>
    <div class="pane" id="p-size">
      <h3>Tamaño del lienzo</h3>
      <div class="sizes" id="sizes"></div>
    </div>
    <div class="pane" id="p-templates">
      <h3>Plantillas</h3>
      <div class="layers" id="templates"></div>
    </div>
  </aside>
  <main id="ws">
    <canvas id="c"></canvas>
    <div id="zoombox"><button id="zo">−</button><span id="zv">100%</span><button id="zi">+</button><button id="zf" title="Ajustar">⤢</button></div>
  </main>
</div>
<div id="toast"></div>

<!-- Galería multi-proyecto -->
<div id="gallery" role="dialog" aria-modal="true" aria-label="Mis diseños">
  <div class="gbox">
    <div class="ghead">
      <h2>Mis diseños</h2>
      <button class="tb" id="gNew">+ Nuevo</button>
      <button class="tb" id="gClose">Cerrar</button>
    </div>
    <div class="gbody" id="gBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let W=1080,H=1080,zoom=1,restoring=false,hist=[],hi=-1,clip=null,userZoomed=false;
const canvas=new fabric.Canvas('c',{width:W,height:H,backgroundColor:'#ffffff',preserveObjectStacking:true,selectionColor:'rgba(23,178,106,.15)',selectionBorderColor:'#17b26a'});
fabric.Object.prototype.set({cornerColor:'#fff',cornerStrokeColor:'#17b26a',borderColor:'#17b26a',cornerStyle:'circle',cornerSize:11,transparentCorners:false,borderScaleFactor:1.6});

/* ---------- Utilidades ---------- */
function toast(m,ms=1800){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms)}
function debounce(fn,ms=120){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function sanitizeName(n){return (n||'diseno').trim().replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,'_').replace(/\s+/g,'_').slice(0,80)||'diseno'}
function getVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
const COLOR_OK=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i;
function toHex(c){
  if(typeof c!=='string')return '#000000';
  if(COLOR_OK.test(c)){ if(c.length===4)return '#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return c.toLowerCase(); }
  const x=document.createElement('canvas').getContext('2d');
  x.fillStyle='#000000'; x.fillStyle=c; const v=x.fillStyle;
  if(COLOR_OK.test(v))return v;
  const m=v.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
  if(m)return '#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join('');
  return '#000000';
}
/* ID estable por objeto para capas */
function ensureIds(){canvas.getObjects().forEach(o=>{if(!o._id)o._id='o'+(Math.random()*1e9|0)})}

/* ---------- Zoom ---------- */
function setZoom(z,fromUser=false){zoom=Math.max(.1,Math.min(3,z));if(fromUser)userZoomed=true;canvas.setZoom(zoom);canvas.setDimensions({width:W*zoom,height:H*zoom});$('#zv').textContent=Math.round(zoom*100)+'%'}
function fit(){const w=$('#ws');const z=Math.min((w.clientWidth-90)/W,(w.clientHeight-90)/H);setZoom(z,false);userZoomed=false}
$('#zi').onclick=()=>setZoom(zoom+.1,true);$('#zo').onclick=()=>setZoom(zoom-.1,true);$('#zf').onclick=fit;
const onResize=debounce(()=>{ if(!userZoomed) fit(); },150);
addEventListener('resize',onResize);
$('#ws').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom-e.deltaY*.002,true)}},{passive:false});

/* ---------- Persistencia multi-proyecto ---------- */
const LS_INDEX='verdi-projects', LS_CURRENT='verdi-current';
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function readIndex(){try{return JSON.parse(localStorage.getItem(LS_INDEX))||[]}catch(e){return[]}}
function writeIndex(a){try{localStorage.setItem(LS_INDEX,JSON.stringify(a));return true}catch(e){toast('Sin espacio en el navegador');return false}}
function saveProject(force=false){
  const id=localStorage.getItem(LS_CURRENT)||(()=>{const i=uid();localStorage.setItem(LS_CURRENT,i);return i})();
  const idx=readIndex();
  const title=$('#title').value||'Diseño sin título';
  const json=JSON.stringify(canvas.toJSON(['lockMovementX','lockMovementY','lockScalingX','lockScalingY','lockRotation','_locked','_id','_name','_hidden']));
  let thumb='';
  try{ thumb=canvas.toDataURL({format:'jpeg',quality:.4,multiplier:120/Math.max(W,H)}); }catch(e){}
  const rec={id,title,w:W,h:H,json,thumb,updated:Date.now()};
  const i=idx.findIndex(p=>p.id===id);
  if(i>=0)idx[i]=rec;else idx.unshift(rec);
  if(!writeIndex(idx))return false;
  $('#savestate').textContent='Guardado ✓'; setTimeout(()=>{$('#savestate').textContent=''},1600);
  return true;
}
function loadProject(id){
  const idx=readIndex(); const p=idx.find(x=>x.id===id); if(!p)return;
  localStorage.setItem(LS_CURRENT,id);
  W=p.w;H=p.h;$('#title').value=p.title||'Diseño sin título';
  canvas.setBackgroundColor('#ffffff'); // reset antes de cargar
  load(p.json,()=>{ hist=[]; hi=-1; snap(); fit(); toast('Abierto: '+p.title); });
  closeGallery();
}
function newProject(){
  const id=uid(); localStorage.setItem(LS_CURRENT,id);
  canvas.clear(); canvas.setBackgroundColor('#ffffff'); canvas.renderAll();
  W=1080;H=1080; $('#title').value='Diseño sin título';
  hist=[];hi=-1; snap(); fit(); closeGallery(); toast('Nuevo diseño');
}

/* ---------- Historial y autoguardado ---------- */
const saveSoon=debounce(()=>saveProject(),800);
function snap(){
  if(restoring)return;
  ensureIds();
  const j=JSON.stringify(canvas.toJSON(['lockMovementX','lockMovementY','lockScalingX','lockScalingY','lockRotation','_locked','_id','_name','_hidden']));
  hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>60)hist.shift();hi=hist.length-1;
  buttons(); renderLayers();
  saveSoon();
}
function load(j,cb){
  restoring=true;
  try{

/* ---------- Alineación / distribución ---------- */
function bboxAll(){return canvas.getObjects().filter(o=>o.visible!==false)}
function centerH(){each(o=>{const r=o.getBoundingRect(true,true);o.set({left:o.left+(W/2-(r.left+r.width/2))});o.setCoords()})}
function centerV(){each(o=>{const r=o.getBoundingRect(true,true);o.set({top:o.top+(H/2-(r.top+r.height/2))});o.setCoords()})}
function alignL(){each(o=>{const r=o.getBoundingRect(true,true);o.set({left:o.left+(0-r.left)});o.setCoords()})}
function alignR(){each(o=>{const r=o.getBoundingRect(true,true);o.set({left:o.left+(W-(r.left+r.width))});o.setCoords()})}
function alignT(){each(o=>{const r=o.getBoundingRect(true,true);o.set({top:o.top+(0-r.top)});o.setCoords()})}
function alignB(){each(o=>{const r=o.getBoundingRect(true,true);o.set({top:o.top+(H-(r.top+r.height))});o.setCoords()})}
function distribute(axis){
  const a=act(); if(a.length<3){toast('Selecciona al menos 3 objetos');return}
  const items=a.map(o=>({o,r:o.getBoundingRect(true,true)})).sort((x,y)=>axis==='h'?x.r.left-y.r.left:x.r.top-y.r.top);
  const first=items[0], last=items[items.length-1];
  if(axis==='h'){
    const total=last.r.left+last.r.width-first.r.left;
    const sum=items.reduce((s,i)=>s+i.r.width,0);
    const gap=(total-sum)/(items.length-1);
    let x=first.r.left;
    items.forEach((it,i)=>{ if(i===0||i===items.length-1){x+=it.r.width+gap;return}
      it.o.set({left:it.o.left+(x-it.r.left)});it.o.setCoords();x+=it.r.width+gap; });
  }else{
    const total=last.r.top+last.r.height-first.r.top;
    const sum=items.reduce((s,i)=>s+i.r.height,0);
    const gap=(total-sum)/(items.length-1);
    let y=first.r.top;
    items.forEach((it,i)=>{ if(i===0||i===items.length-1){y+=it.r.height+gap;return}
      it.o.set({top:it.o.top+(y-it.r.top)});it.o.setCoords();y+=it.r.height+gap; });
  }
  canvas.requestRenderAll();snap();
}

$('#alL').onclick=alignL;$('#alR').onclick=alignR;
$('#alT').onclick=alignT;$('#alB').onclick=alignB;

/* ---------- Snapping / guías ---------- */
const guideColor=getVar('--g5')||'#17b26a';
let guides=[];
function clearGuides(){guides.forEach(g=>canvas.remove(g));guides=[]}
function drawGuide(coord,orientation){
  const g=orientation==='v'
    ? new fabric.Line([coord,0,coord,H],{stroke:guideColor,strokeWidth:1,selectable:false,evented:false,strokeDashArray:[4,4],excludeFromExport:true})
    : new fabric.Line([0,coord,W,coord],{stroke:guideColor,strokeWidth:1,selectable:false,evented:false,strokeDashArray:[4,4],excludeFromExport:true});
  g._guide=true;canvas.add(g);guides.push(g);
}
canvas.on('object:moving',e=>{
  clearGuides();
  const o=e.target, r=o.getBoundingRect(true,true);
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const T=8;
  if(Math.abs(cx-W/2)<T){o.set({left:o.left+(W/2-cx)});drawGuide(W/2,'v')}
  if(Math.abs(cy-H/2)<T){o.set({top:o.top+(H/2-cy)});drawGuide(H/2,'h')}
  const others=bboxAll().filter(x=>x!==o&&!x._guide);
  others.forEach(x=>{
    const rr=x.getBoundingRect(true,true);
    if(Math.abs(cx-(rr.left+rr.width/2))<T){o.set({left:o.left+((rr.left+rr.width/2)-cx)});drawGuide(rr.left+rr.width/2,'v')}
    if(Math.abs(cy-(rr.top+rr.height/2))<T){o.set({top:o.top+((rr.top+rr.height/2)-cy)});drawGuide(rr.top+rr.height/2,'h')}
  });
  o.setCoords();
});
canvas.on('mouse:up',()=>clearGuides());

/* ---------- Capas ---------- */
function iconFor(o){
  if(o.type==='image'){try{return `<img src="${o.getSrc().slice(0,200000)}" alt="">`}catch(e){}}
  if(/text/.test(o.type))return '<b style="font-size:12px">T</b>';
  if(o.type==='circle')return '●';
  if(o.type==='triangle')return '▲';
  if(o.type==='line')return '━';
  if(o.type==='polygon')return '⬢';
  if(o.type==='path')return '✦';
  if(o.type==='rect')return '■';
  return '▢';
}
function nameFor(o){
  if(o._name)return o._name;
  if(/text/.test(o.type))return (o.text||'Texto').slice(0,22);
  if(o.type==='image')return 'Imagen';
  return {rect:'Rectángulo',circle:'Círculo',triangle:'Triángulo',line:'Línea',polygon:'Polígono',path:'Forma',i-text:'Texto',textbox:'Texto'}[o.type]||'Objeto';
}
function renderLayers(){
  const box=$('#layers'); if(!box)return;
  const objs=canvas.getObjects().slice().reverse();
  box.innerHTML=objs.map(o=>{
    const sel=canvas.getActiveObject()===o || (canvas.getActiveObject()?._objects||[]).includes(o);
    return `<div class="layer ${sel?'sel':''}" draggable="true" data-id="${o._id||''}">
      <div class="ic">${iconFor(o)}</div>
      <div class="nm" title="${(o._name||nameFor(o)).replace(/"/g,'')}">${(o._name||nameFor(o)).replace(/</g,'&lt;')}</div>
      <button class="mini ${o.visible===false?'':'act'}" data-act="vis" title="Visibilidad">${o.visible===false?'🚫':'👁'}</button>
      <button class="mini ${o._locked?'act':''}" data-act="lock" title="Bloquear">${o._locked?'🔒':'🔓'}</button>
    </div>`;
  }).join('') || '<p style="color:var(--mut);font-size:13px">Sin elementos todavía.</p>';
  box.querySelectorAll('.layer').forEach(el=>{
    el.onclick=e=>{
      if(e.target.dataset.act)return;
      const o=canvas.getObjects().find(x=>x._id===el.dataset.id);if(!o)return;
      canvas.discardActiveObject();canvas.setActiveObject(o);canvas.requestRenderAll();sync();
    };
    el.querySelectorAll('[data-act]').forEach(btn=>btn.onclick=e=>{
      e.stopPropagation();
      const o=canvas.getObjects().find(x=>x._id===el.dataset.id);if(!o)return;
      if(btn.dataset.act==='vis'){o.set('visible',o.visible===false);o._hidden=o.visible===false;}
      else {const l=!o._locked;o.set({_locked:l,lockMovementX:l,lockMovementY:l,lockScalingX:l,lockScalingY:l,lockRotation:l,hasControls:!l});}
      canvas.requestRenderAll();renderLayers();snap();
    });
    el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.id);el.classList.add('drag')};
    el.ondragend=()=>{el.classList.remove('drag');box.querySelectorAll('.layer').forEach(x=>x.classList.remove('drop-before','drop-after'))};
    el.ondragover=e=>{e.preventDefault();const r=el.getBoundingClientRect();const before=e.clientY<r.top+r.height/2;el.classList.toggle('drop-before',before);el.classList.toggle('drop-after',!before)};
    el.ondragleave=()=>el.classList.remove('drop-before','drop-after');
    el.ondrop=e=>{
      e.preventDefault();
      const srcId=e.dataTransfer.getData('text/plain'); if(!srcId||srcId===el.dataset.id)return;
      const objs=canvas.getObjects();
      const src=objs.find(x=>x._id===srcId), dst=objs.find(x=>x._id===el.dataset.id);
      if(!src||!dst)return;
      // reordenar en el array de objetos de fabric
      const from=objs.indexOf(src), to=objs.indexOf(dst);
      objs.splice(from,1);
      const before=e.clientY<el.getBoundingClientRect().top+el.getBoundingClientRect().height/2;
      const insertAt=before?objs.indexOf(dst)+1:objs.indexOf(dst);
      objs.splice(insertAt,0,src);
      // reasignar orden
      canvas._objects=objs; canvas.renderAll(); snap();
    };
  });
}

addEventListener('keydown',e=>{
  const a=canvas.getActiveObject();
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||(a&&a.isEditing))return;
  const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
  if(k==='delete'||k==='backspace'){e.preventDefault();del()}
  else if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&k==='y'){e.preventDefault();redo()}
  else if(m&&k==='s'){e.preventDefault();if(saveProject(true))toast('Proyecto guardado')}
  else if(m&&k==='c')copy();
  else if(m&&k==='v'&&clip)paste();
  else if(m&&k==='d'){e.preventDefault();copy();paste()}
  else if(m&&k==='a'){
    e.preventDefault();
    const all=canvas.getObjects().filter(o=>o.visible!==false&&!o._locked);
    canvas.discardActiveObject();
    if(all.length){canvas.setActiveObject(new fabric.ActiveSelection(all,{canvas}));canvas.requestRenderAll()}
  }
  else if(a&&k.startsWith('arrow')){
    if(a._locked)return;
    e.preventDefault();const d=e.shiftKey?10:1;
    a.set({left:a.left+(k==='arrowright'?d:k==='arrowleft'?-d:0),top:a.top+(k==='arrowdown'?d:k==='arrowup'?-d:0)});
    a.setCoords();canvas.requestRenderAll();
  }
});

    pdf.save(n+'.pdf');
  }
  else save(canvas.toDataURL({format:f,quality:.95,multiplier:1/zoom}),n+'.'+(f==='jpeg'?'jpg':'png'));
  toast('Descarga lista');
});

/* ---------- Galería ---------- */
function openGallery(){renderGallery();$('#gallery').classList.add('open')}
function closeGallery(){$('#gallery').classList.remove('open')}
function renderGallery(){
  const body=$('#gBody');const idx=readIndex().sort((a,b)=>b.updated-a.updated);
  const cur=localStorage.getItem(LS_CURRENT);
  body.innerHTML=idx.map(p=>`<div class="proj" data-id="${p.id}">
    <div class="thumb">${p.thumb?`<img src="${p.thumb}" alt="">`:'(sin vista previa)'}</div>
    <div class="pmeta"><b>${(p.title||'Sin título').replace(/</g,'&lt;')}</b><small>${p.w}×${p.h} · ${new Date(p.updated).toLocaleDateString()}</small></div>
    <div class="pacts">
      <button data-a="open">${cur===p.id?'Abierto':'Abrir'}</button>
      <button data-a="dup">Duplicar</button>
      <button data-a="del" class="dang">Borrar</button>
    </div>
  </div>`).join('')||'<p style="color:var(--mut)">Aún no hay diseños guardados.</p>';
  body.querySelectorAll('.proj').forEach(el=>{
    const id=el.dataset.id;
    el.querySelector('[data-a="open"]').onclick=()=>loadProject(id);
    el.querySelector('[data-a="dup"]').onclick=()=>{
      const idx=readIndex();const p=idx.find(x=>x.id===id);if(!p)return;
      const copy={...p,id:uid(),title:(p.title||'Sin título')+' (copia)',updated:Date.now()};
      idx.unshift(copy);writeIndex(idx);renderGallery();
    };
    el.querySelector('[data-a="del"]').onclick=()=>{
      if(!confirm('¿Borrar este diseño?'))return;
      const idx=readIndex().filter(x=>x.id!==id);writeIndex(idx);
      if(localStorage.getItem(LS_CURRENT)===id)localStorage.removeItem(LS_CURRENT);
      renderGallery();
    };
  });
}
$('#galleryBtn').onclick=openGallery;
$('#gClose').onclick=closeGallery;
$('#gNew').onclick=()=>{ if(confirm('¿Crear un diseño nuevo? Se guardará el actual.')){saveProject(true);newProject();} };
$('#gallery').addEventListener('click',e=>{if(e.target.id==='gallery')closeGallery()});

const SIZES=[['Publicación',1080,1080],['Historia',1080,1920],['Presentación',1920,1080],['Póster A4',794,1123],['Banner',1500,500]];
$('#sizes').innerHTML=SIZES.map((s,i)=>`<button data-i="${i}">${s[0]}<small>${s[1]}×${s[2]}</small></button>`).join('');
const COLORS=['#ffffff','#f3fbf6','#e3f5ea','#b7e8cc','#3fd18a','#17b26a','#0f5a41','#062b20','#fff6d6','#ffd9c7','#d9e8ff','#111111'];
$('#swatches').innerHTML=COLORS.map(c=>`<button style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('');
$$('[data-c]').forEach(b=>b.onclick=()=>bg(b.dataset.c));
renderTemplates();
ensureIds();

(function boot(){
  const cur=localStorage.getItem(LS_CURRENT);
  const idx=readIndex();
  const p=cur&&idx.find(x=>x.id===cur);
  if(p){
    W=p.w;H=p.h;$('#title').value=p.title||'Diseño sin título';
    fit();
    load(p.json,()=>{hist=[JSON.stringify(canvas.toJSON(['lockMovementX','lockMovementY','lockScalingX','lockScalingY','lockRotation','_locked','_id','_name','_hidden']))];hi=0;buttons();toast('Diseño recuperado')});
  }else{
    fit();snap();
  }
  buttons();renderLayers();
})();
</script>
