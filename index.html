<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verdi · Editor de diseños</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Poppins:wght@400;700&family=Playfair+Display:wght@400;700&family=Pacifico&family=Bebas+Neue&family=Montserrat:wght@400;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<style>
:root{--g9:#062b20;--g8:#0b3b2c;--g7:#0f5a41;--g5:#17b26a;--g4:#3fd18a;--g1:#e3f5ea;--g0:#f3fbf6;--ink:#10231b;--mut:#5d7a6c;--line:#cfe6d9}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--g1);display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g4);outline-offset:2px}

header{height:56px;background:linear-gradient(90deg,var(--g9),var(--g7));color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:8px}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50% 0 50% 0;background:var(--g4);margin-right:6px}
#title{background:rgba(255,255,255,.12);border:1px solid transparent;color:#fff;border-radius:8px;padding:7px 10px;width:190px}
#title:hover,#title:focus{border-color:rgba(255,255,255,.4)}
.sp{flex:1}
.hb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;padding:8px 11px;font-weight:600}
.hb:hover:not(:disabled){background:rgba(255,255,255,.22)}
.hb:disabled{opacity:.4;cursor:default}
.hb.main{background:var(--g5);color:#04170f}
.hb.main:hover{background:var(--g4)!important}
.menu{position:relative}
.drop{display:none;position:absolute;right:0;top:42px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(6,43,32,.3);padding:6px;min-width:190px;z-index:20}
.drop.open{display:block}
.drop button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:7px}
.drop button:hover{background:var(--g1)}

#bar{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px;flex:none;overflow-x:auto;white-space:nowrap}
#bar .hint{color:var(--mut);font-size:14px}
.grp{display:none;align-items:center;gap:6px}
.grp.on{display:flex}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb{min-width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 9px;font-weight:600;color:var(--g8)}
.tb:hover{background:var(--g1)}
.tb.act{background:var(--g8);color:#fff;border-color:var(--g8)}
.clr{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
input[type=color]{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}
input[type=range]{accent-color:var(--g5);width:90px}
select{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 6px}
#fsize{width:62px;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 6px}

.body{flex:1;display:flex;min-height:0}
#rail{width:76px;background:var(--g8);display:flex;flex-direction:column;padding:8px 0;flex:none}
#rail button{background:none;border:0;color:#a9d9c1;padding:12px 0;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;border-left:3px solid transparent}
#rail button span{font-size:22px;line-height:1}
#rail button:hover{color:#fff}
#rail button.on{color:#fff;background:var(--g7);border-left-color:var(--g4)}
#panel{width:290px;background:#fff;border-right:1px solid var(--line);padding:16px;overflow-y:auto;flex:none}
#panel h3{margin:0 0 12px;font-size:15px}
.pane{display:none}
.pane.on{display:block}
.big{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--g0);border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--ink)}
.big:hover{border-color:var(--g5);background:var(--g1)}

.tpl-card{border:1px solid var(--line);background:var(--g0);border-radius:10px;overflow:hidden;margin-bottom:10px;cursor:pointer;transition:.2s}
.tpl-card:hover{border-color:var(--g5);background:var(--g1);transform:translateY(-2px);box-shadow:0 4px 12px rgba(6,43,32,.08)}
.tpl-thumb{height:110px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;padding:10px;text-align:center}
.tpl-title{padding:8px 12px;font-size:13px;font-weight:600;border-top:1px solid var(--line);background:#fff}

.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shapes button{aspect-ratio:1;border:1px solid var(--line);background:var(--g0);border-radius:10px;font-size:26px;color:var(--g7)}
.shapes button:hover{border-color:var(--g5);background:var(--g1)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:14px}
.sw button{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.drop-zone{border:2px dashed var(--g5);background:var(--g0);border-radius:12px;padding:26px 12px;text-align:center;color:var(--g7);font-weight:600;cursor:pointer}
.drop-zone.over{background:var(--g1)}
.sizes button{display:flex;justify-content:space-between;width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:6px}
.sizes button:hover{background:var(--g1)}
.sizes small{color:var(--mut)}
label.f{display:block;font-size:13px;color:var(--mut);margin:8px 0 5px}

#ws{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative;background:radial-gradient(circle at 1px 1px,#b7dcc6 1px,transparent 0) 0 0/22px 22px,var(--g1)}
.canvas-container{box-shadow:0 8px 30px rgba(6,43,32,.22);margin:auto}
#zoombox{position:absolute;right:14px;bottom:14px;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(6,43,32,.2);display:flex;align-items:center;gap:6px;padding:6px 8px}
#zoombox button{border:0;background:var(--g1);width:28px;height:28px;border-radius:6px;font-weight:800;color:var(--g8)}
#zoombox span{min-width:44px;text-align:center;font-size:13px;font-weight:600}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--g9);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){#panel{display:none}#title{width:110px}.logo{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo"><i></i>Verdi</div>
  <input id="title" value="Diseño sin título" aria-label="Nombre del diseño">
  <button class="hb" id="undo" title="Deshacer (Ctrl+Z)">↶</button>
  <button class="hb" id="redo" title="Rehacer (Ctrl+Y)">↷</button>
  <div class="sp"></div>
  <div id="auth-slot"></div>
  <div class="menu">
    <button class="hb main" id="dlbtn">Descargar ▾</button>
    <div class="drop" id="dl">
      <button data-f="png">PNG (alta calidad)</button>
      <button data-f="jpeg">JPG</button>
      <button data-f="svg">SVG (vectorial)</button>
      <button data-f="json">Proyecto (.json)</button>
    </div>
  </div>
</header>

<div id="bar">
  <span class="hint" id="hint">Selecciona un elemento para editarlo</span>
  <div class="grp" id="g-all">
    <label class="clr">Relleno <input type="color" id="fill" value="#17b26a"></label>
    <label class="clr">Borde <input type="color" id="stroke" value="#0b3b2c"></label>
    <select id="sw" title="Grosor del borde"><option value="0">Sin borde</option><option value="2">2 px</option><option value="4">4 px</option><option value="8">8 px</option></select>
    <label class="clr">Opacidad <input type="range" id="op" min="5" max="100" value="100"></label>
    <div class="sep"></div>
    <button class="tb" id="front" title="Traer al frente">⬆</button>
    <button class="tb" id="back" title="Enviar atrás">⬇</button>
    <button class="tb" id="dup" title="Duplicar (Ctrl+D)">⧉</button>
    <button class="tb" id="lock" title="Bloquear">🔒</button>
    <button class="tb" id="del" title="Eliminar (Supr)">🗑</button>
  </div>
  <div class="grp" id="g-text">
    <div class="sep"></div>
    <select id="font" title="Fuente"></select>
    <input id="fsize" type="number" min="6" max="400" value="40" title="Tamaño">
    <button class="tb" id="bold"><b>B</b></button>
    <button class="tb" id="ital"><i>I</i></button>
    <button class="tb" id="under"><u>U</u></button>
    <button class="tb" data-al="left" title="Izquierda">≡</button>
    <button class="tb" data-al="center" title="Centro">☰</button>
    <button class="tb" data-al="right" title="Derecha">≣</button>
  </div>
</div>

<div class="body">
  <nav id="rail">
    <button class="on" data-p="text"><span>T</span>Texto</button>
    <button data-p="shapes"><span>◆</span>Formas</button>
    <button data-p="upload"><span>⇪</span>Subir</button>
    <button data-p="bg"><span>▨</span>Fondo</button>
    <button data-p="size"><span>⤢</span>Tamaño</button>
    <button data-p="templates"><span>✦</span>Plantillas</button>
  </nav>
  <aside id="panel">
    <div class="pane on" id="p-text">
      <h3>Texto</h3>
      <button class="big" data-t="h" style="font:800 24px 'Plus Jakarta Sans'">Añadir un título</button>
      <button class="big" data-t="s" style="font:600 17px 'Plus Jakarta Sans'">Añadir un subtítulo</button>
      <button class="big" data-t="b" style="font:400 14px 'Plus Jakarta Sans'">Añadir un párrafo de texto</button>
      <h3 style="margin-top:18px">Combinaciones</h3>
      <button class="big" data-t="c1" style="font:400 22px 'Pacifico';color:#0f5a41">Hecho con cariño</button>
      <button class="big" data-t="c2" style="font:400 24px 'Bebas Neue';letter-spacing:.06em">GRAN OFERTA</button>
      <button class="big" data-t="c3" style="font:700 20px 'Playfair Display'">Elegancia clásica</button>
    </div>
    <div class="pane" id="p-shapes">
      <h3>Formas</h3>
      <div class="shapes">
        <button data-s="rect" title="Rectángulo">■</button>
        <button data-s="round" title="Rectángulo redondeado">▢</button>
        <button data-s="circle" title="Círculo">●</button>
        <button data-s="tri" title="Triángulo">▲</button>
        <button data-s="star" title="Estrella">★</button>
        <button data-s="heart" title="Corazón">♥</button>
        <button data-s="line" title="Línea">━</button>
        <button data-s="arrow" title="Flecha">➜</button>
        <button data-s="hex" title="Hexágono">⬢</button>
      </div>
    </div>
    <div class="pane" id="p-upload">
      <h3>Imágenes</h3>
      <div class="drop-zone" id="dz">Haz clic o suelta aquí tus imágenes</div>
      <input type="file" id="file" accept="image/*" multiple hidden>
    </div>
    <div class="pane" id="p-bg">
      <h3>Color de fondo</h3>
      <div class="sw" id="swatches"></div>
      <label class="f">Color personalizado</label>
      <input type="color" id="bgc" value="#ffffff">
    </div>
    <div class="pane" id="p-size">
      <h3>Tamaño del lienzo</h3>
      <div class="sizes" id="sizes"></div>
    </div>
    <div class="pane" id="p-templates">
      <h3>Plantillas prediseñadas</h3>
      <div id="templates-list"></div>
    </div>
  </aside>
  <main id="ws">
    <canvas id="c"></canvas>
    <div id="zoombox"><button id="zo">−</button><span id="zv">100%</span><button id="zi">+</button><button id="zf" title="Ajustar">⤢</button></div>
  </main>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let W=1080,H=1080,zoom=1,restoring=false,hist=[],hi=-1,clip=null;
const canvas=new fabric.Canvas('c',{width:W,height:H,backgroundColor:'#ffffff',preserveObjectStacking:true,selectionColor:'rgba(23,178,106,.15)',selectionBorderColor:'#17b26a'});
fabric.Object.prototype.set({cornerColor:'#fff',cornerStrokeColor:'#17b26a',borderColor:'#17b26a',cornerStyle:'circle',cornerSize:11,transparentCorners:false,borderScaleFactor:1.6});

const FONTS=['Plus Jakarta Sans','Poppins','Montserrat','Playfair Display','Pacifico','Bebas Neue','Georgia','Arial','Courier New'];
$('#font').innerHTML=FONTS.map(f=>`<option style="font-family:'${f}'">${f}</option>`).join('');
const SIZES=[['Publicación',1080,1080],['Historia',1080,1920],['Presentación',1920,1080],['Póster A4',794,1123],['Banner',1500,500]];
$('#sizes').innerHTML=SIZES.map((s,i)=>`<button data-i="${i}">${s[0]}<small>${s[1]}×${s[2]}</small></button>`).join('');
const COLORS=['#ffffff','#f3fbf6','#e3f5ea','#b7e8cc','#3fd18a','#17b26a','#0f5a41','#062b20','#fff6d6','#ffd9c7','#d9e8ff','#111111'];
$('#swatches').innerHTML=COLORS.map(c=>`<button style="background:${c}" data-c="${c}" aria-label="${c}"></button>`).join('');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- Zoom ---------- */
function setZoom(z){zoom=Math.max(.1,Math.min(3,z));canvas.setZoom(zoom);canvas.setDimensions({width:W*zoom,height:H*zoom});$('#zv').textContent=Math.round(zoom*100)+'%'}
function fit(){const w=$('#ws');setZoom(Math.min((w.clientWidth-90)/W,(w.clientHeight-90)/H))}
$('#zi').onclick=()=>setZoom(zoom+.1);$('#zo').onclick=()=>setZoom(zoom-.1);$('#zf').onclick=fit;
addEventListener('resize',fit);
$('#ws').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();setZoom(zoom-e.deltaY*.002)}},{passive:false});

/* ---------- Historial y autoguardado ---------- */
function snap(){if(restoring)return;const j=JSON.stringify(canvas.toJSON(['lockMovementX','lockMovementY','lockScalingX','lockScalingY','lockRotation','_locked']));hist=hist.slice(0,hi+1);hist.push(j);if(hist.length>60)hist.shift();hi=hist.length-1;buttons();
  try{localStorage.setItem('verdi-design',JSON.stringify({w:W,h:H,title:$('#title').value,json:j}))}catch(e){}}
function load(j,cb){restoring=true;canvas.loadFromJSON(j,()=>{canvas.renderAll();restoring=false;buttons();sync();cb&&cb()})}
function undo(){if(hi>0){hi--;load(hist[hi])}}
function redo(){if(hi<hist.length-1){hi++;load(hist[hi])}}
function buttons(){$('#undo').disabled=hi<=0;$('#redo').disabled=hi>=hist.length-1}
['object:added','object:modified','object:removed'].forEach(e=>canvas.on(e,snap));
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#title').oninput=()=>{try{const d=JSON.parse(localStorage.getItem('verdi-design'));d.title=$('#title').value;localStorage.setItem('verdi-design',JSON.stringify(d))}catch(e){}};  /* ---------- Panel lateral (Corregido) ---------- */ $$('#rail button').forEach(b=>b.onclick=()=>{
  $$('#rail button').forEach(x=>x.classList.remove('on')); $$
('#panel .pane').forEach(p=>p.classList.remove('on'));
  b.classList.add('on');
  const pane = $('#p-' + b.dataset.p);
  if(pane) pane.classList.add('on');
});

function place(o){o.set({left:W/2,top:H/2,originX:'center',originY:'center'});canvas.add(o).setActiveObject(o);canvas.requestRenderAll()}

/* ---------- Sistema de Plantillas Editables ---------- */
const PLANTILLAS = [
  {
    name: 'Anuncio Minimalista',
    previewBg: '#e3f5ea',
    previewColor: '#0f5a41',
    build() {
      canvas.clear();
      bg('#f3fbf6');
      const t1 = new fabric.IText('NUEVA COLECCIÓN', { fontSize: 70, fontWeight: 800, fontFamily: 'Plus Jakarta Sans', fill: '#062b20', left: W/2, top: H/2 - 80, originX: 'center', originY: 'center' });
      const t2 = new fabric.IText('Diseños modernos para tu día a día', { fontSize: 32, fontFamily: 'Poppins', fill: '#5d7a6c', left: W/2, top: H/2 + 20, originX: 'center', originY: 'center' });
      canvas.add(t1, t2);
      canvas.requestRenderAll();
      snap();
    }
  },
  {
    name: 'Oferta Especial',
    previewBg: '#fff0b3',
    previewColor: '#8a6d0b',
    build() {
      canvas.clear();
      bg('#fff6d6');
      const box = new fabric.Rect({ width: W - 140, height: H - 140, fill: '#ffffff', stroke: '#17b26a', strokeWidth: 6, rx: 20, ry: 20, left: W/2, top: H/2, originX: 'center', originY: 'center' });
      const t1 = new fabric.IText('GRAN VENTA', { fontSize: 110, fontFamily: 'Bebas Neue', fill: '#0b3b2c', left: W/2, top: H/2 - 60, originX: 'center', originY: 'center', charSpacing: 100 });
      const t2 = new fabric.IText('Hasta 50% de descuento en todo', { fontSize: 36, fontFamily: 'Plus Jakarta Sans', fontWeight: 600, fill: '#17b26a', left: W/2, top: H/2 + 60, originX: 'center', originY: 'center' });
      canvas.add(box, t1, t2);
      canvas.requestRenderAll();
      snap();
    }
  },
  {
    name: 'Cita Inspiradora',
    previewBg: '#0b3b2c',
    previewColor: '#3fd18a',
    build() {
      canvas.clear();
      bg('#062b20');
      const t1 = new fabric.IText('"El éxito es la suma de pequeños esfuerzos repetidos día tras día."', { fontSize: 55, fontFamily: 'Playfair Display', fontStyle: 'italic', fill: '#ffffff', left: W/2, top: H/2 - 40, originX: 'center', originY: 'center', width: W - 200, textAlign: 'center' });
      canvas.add(t1);
      canvas.requestRenderAll();
      snap();
    }
  }
];

function renderTemplatesMenu() {
  const container = $('#templates-list');
  if(!container) return;
  container.innerHTML = PLANTILLAS.map((tpl, index) => `
    <div class="tpl-card" data-index="${index}">
      <div class="tpl-thumb" style="background:${tpl.previewBg}; color:${tpl.previewColor}">
        ${tpl.name}
      </div>
      <div class="tpl-title">${tpl.name}</div>
    </div>
  `).join('');

  container.querySelectorAll('.tpl-card').forEach(card => {
    card.onclick = () => {
      if(canvas.getObjects().length > 0 && !confirm('¿Aplicar esta plantilla? Se reemplazará el contenido actual.')) return;
      const idx = card.dataset.index;
      PLANTILLAS[idx].build();
      toast('Plantilla aplicada correctamente');
    };
  });
}
renderTemplatesMenu();

/* ---------- Texto ---------- */
const TXT={h:['Añade un título',{fontSize:90,fontWeight:800,fontFamily:'Plus Jakarta Sans'}],s:['Añade un subtítulo',{fontSize:56,fontWeight:600,fontFamily:'Plus Jakarta Sans'}],b:['Escribe aquí tu texto. Haz doble clic para editarlo.',{fontSize:34,width:620,fontFamily:'Plus Jakarta Sans'}],
  c1:['Hecho con cariño',{fontSize:100,fontFamily:'Pacifico',fill:'#0f5a41'}],c2:['GRAN OFERTA',{fontSize:140,fontFamily:'Bebas Neue',charSpacing:120}],c3:['Elegancia clásica',{fontSize:80,fontFamily:'Playfair Display',fontWeight:700}]};
$$('[data-t]').forEach(b=>b.onclick=()=>{const [t,o]=TXT[b.dataset.t];const f=document.fonts?document.fonts.load(`${o.fontSize}px "${o.fontFamily}"`):Promise.resolve();f.finally(()=>{const T=o.width?fabric.Textbox:fabric.IText;place(new T(t,{fill:'#10231b',...o}))})});

/* ---------- Formas ---------- */
const G='#17b26a';
function star(n=5,R=100,r=45){const p=[];for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,d=i%2?r:R;p.push({x:R+d*Math.cos(a),y:R+d*Math.sin(a)})}return p}
const SH={rect:()=>new fabric.Rect({width:260,height:260,fill:G}),
  round:()=>new fabric.Rect({width:320,height:200,rx:36,ry:36,fill:G}),
  circle:()=>new fabric.Circle({radius:140,fill:G}),
  tri:()=>new fabric.Triangle({width:280,height:250,fill:G}),
  star:()=>new fabric.Polygon(star(),{fill:G,scaleX:2.2,scaleY:2.2}),
  hex:()=>new fabric.Polygon(star(6,100,100).filter((_,i)=>i%2==0),{fill:G,scaleX:2.2,scaleY:2.2}),
  heart:()=>new fabric.Path('M 0 -40 C -60 -110 -150 -30 0 90 C 150 -30 60 -110 0 -40 z',{fill:G,scaleX:1.4,scaleY:1.4}),
  line:()=>new fabric.Line([0,0,360,0],{stroke:'#0b3b2c',strokeWidth:8,strokeLineCap:'round'}),
  arrow:()=>new fabric.Path('M 0 20 L 200 20 L 200 0 L 260 50 L 200 100 L 200 80 L 0 80 z',{fill:G,scaleX:1.2,scaleY:1.2})};
$$('[data-s]').forEach(b=>b.onclick=()=>place(SH[b.dataset.s]()));

/* ---------- Imágenes ---------- */
function addFiles(fl){[...fl].filter(f=>f.type.startsWith('image/')).forEach(f=>{const r=new FileReader();r.onload=()=>fabric.Image.fromURL(r.result,img=>{const s=Math.min(W*.7/img.width,H*.7/img.height,1);img.scale(s);place(img)});r.readAsDataURL(f)})}
const dz=$('#dz');dz.onclick=()=>$('#file').click();$('#file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');addFiles(e.dataTransfer.files)};
$('#ws').ondragover=e=>e.preventDefault();$('#ws').ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files)};
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])];if(f.length)addFiles(f)});

/* ---------- Fondo y tamaño ---------- */
function bg(c){canvas.setBackgroundColor(c,()=>{canvas.renderAll();snap()});$('#bgc').value=c} $$('[data-c]').forEach(b=>b.onclick=()=>bg(b.dataset.c));$('#bgc').onchange=e=>bg(e.target.value); $$('#sizes button').forEach(b=>b.onclick=()=>{const s=SIZES[b.dataset.i];W=s[1];H=s[2];fit();snap();toast('Tamaño: '+s[0])});

/* ---------- Barra contextual ---------- */
const act=()=>canvas.getActiveObjects();
const each=fn=>{act().forEach(fn);canvas.requestRenderAll();snap()};
const isT=o=>o&&/text/.test(o.type);
function sync(){const a=canvas.getActiveObject();$('#g-all').classList.toggle('on',!!a);$('#hint').style.display=a?'none':'';
  const t=a&&(isT(a)||(a.type==='activeSelection'&&a._objects.every(isT)));$('#g-text').classList.toggle('on',!!t);
  if(!a)return;const o=a.type==='activeSelection'?a._objects[0]:a;
  if(typeof o.fill==='string')$('#fill').value=toHex(o.fill);if(typeof o.stroke==='string')$('#stroke').value=toHex(o.stroke);
  $('#sw').value=[0,2,4,8].includes(o.strokeWidth)?o.strokeWidth:0;$('#op').value=(o.opacity??1)*100;
  if(isT(o)){$('#font').value=o.fontFamily;$('#fsize').value=Math.round(o.fontSize*(o.scaleY||1));$('#bold').classList.toggle('act',o.fontWeight>=700\vert{}\vert{}o.fontWeight==='bold');$('#ital').classList.toggle('act',o.fontStyle==='italic');$('#under').classList.toggle('act',!!o.underline);$$('[data-al]').forEach(b=>b.classList.toggle('act',b.dataset.al===o.textAlign))}$('#lock').textContent=a._locked?'🔓':'🔒'}
function toHex(c){const x=document.createElement('canvas').getContext('2d');x.fillStyle=c;return x.fillStyle.length===7?x.fillStyle:'#000000'}
['selection:created','selection:updated','selection:cleared'].forEach(e=>canvas.on(e,sync));
canvas.on('object:scaling',sync);

$('#fill').oninput=e=>each(o=>o.set('fill',e.target.value));
$('#stroke').oninput=e=>each(o=>o.set({stroke:e.target.value,strokeWidth:o.strokeWidth||(o.type==='line'?8:2)}));
$('#sw').onchange=e=>each(o=>o.set({stroke:o.stroke\vert{}\vert{}$('#stroke').value,strokeWidth:+e.target.value}));
$('#op').oninput=e=>{act().forEach(o=>o.set('opacity',e.target.value/100));canvas.requestRenderAll()};$('#op').onchange=snap;
$('#font').onchange=e=>{const f=e.target.value;(document.fonts?document.fonts.load(`40px "${f}"`):Promise.resolve()).finally(()=>each(o=>o.set('fontFamily',f)))};
$('#fsize').onchange=e=>each(o=>{o.set({fontSize:+e.target.value,scaleX:1,scaleY:1})});
const tog=(id,fn)=>$(id).onclick=()=>{each(fn);sync()}; tog('#bold',o=>o.set('fontWeight',(o.fontWeight>=700\vert{}\vert{}o.fontWeight==='bold')?400:700)); tog('#ital',o=>o.set('fontStyle',o.fontStyle==='italic'?'normal':'italic')); tog('#under',o=>o.set('underline',!o.underline)); $$('[data-al]').forEach(b=>b.onclick=()=>{each(o=>o.set('textAlign',b.dataset.al));sync()});
$('#front').onclick=()=>{each(o=>canvas.bringToFront(o))};$('#back').onclick=()=>{each(o=>canvas.sendToBack(o))};
function del(){const a=act();if(!a.length)return;canvas.discardActiveObject();a.forEach(o=>canvas.remove(o))}
function copy(){const a=canvas.getActiveObject();if(a)a.clone(c=>clip=c)}
function paste(){if(!clip)return;clip.clone(c=>{canvas.discardActiveObject();c.set({left:c.left+30,top:c.top+30,evented:true});if(c.type==='activeSelection'){c.canvas=canvas;c.forEachObject(o=>canvas.add(o));c.setCoords()}else canvas.add(c);clip.top+=30;clip.left+=30;canvas.setActiveObject(c);canvas.requestRenderAll()})}
$('#dup').onclick=()=>{copy();paste()};$('#del').onclick=del;
$('#lock').onclick=()=>{const l=!canvas.getActiveObject()._locked;each(o=>o.set({_locked:l,lockMovementX:l,lockMovementY:l,lockScalingX:l,lockScalingY:l,lockRotation:l,hasControls:!l}));canvas.getActiveObject()._locked=l;sync();toast(l?'Elemento bloqueado':'Elemento desbloqueado')};

/* ---------- Atajos ---------- */
addEventListener('keydown',e=>{const a=canvas.getActiveObject();if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)||(a&&a.isEditing))return;
  const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
  if(k==='delete'||k==='backspace'){e.preventDefault();del()}
  else if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(m&&k==='y'){e.preventDefault();redo()}
  else if(m&&k==='c')copy();else if(m&&k==='v'&&clip)paste();else if(m&&k==='d'){e.preventDefault();copy();paste()}
  else if(m&&k==='a'){e.preventDefault();canvas.discardActiveObject();canvas.setActiveObject(new fabric.ActiveSelection(canvas.getObjects(),{canvas}));canvas.requestRenderAll()}
  else if(a&&k.startsWith('arrow')){e.preventDefault();const d=e.shiftKey?10:1;a.set({left:a.left+(k==='arrowright'?d:k==='arrowleft'?-d:0),top:a.top+(k==['arrowdown']?d:k==='arrowup'?-d:0)});a.setCoords();canvas.requestRenderAll()}});
canvas.on('mouse:up',()=>{});

/* ---------- Descargas ---------- */
$('#dlbtn').onclick=e=>{e.stopPropagation();$('#dl').classList.toggle('open')};
addEventListener('click',()=>$('#dl').classList.remove('open')); function save(href,name){const a=document.createElement('a');a.href=href;a.download=name;a.click()} $$('#dl button').forEach(b=>b.onclick=()=>{const f=b.dataset.f,n=($('#title').value||'diseno').trim();canvas.discardActiveObject().renderAll();
  if(f==='svg'){const s=canvas.toSVG({width:W,height:H,viewBox:{x:0,y:0,width:W,height:H}});save(URL.createObjectURL(new Blob([s],{type:['image/svg+xml']})),n+'.svg')}
  else if(f==='json')save(URL.createObjectURL(new Blob([JSON.stringify({w:W,h:H,canvas:canvas.toJSON()})],{type:'application/json'})),n+'.json');
  else save(canvas.toDataURL({format:f,quality:.95,multiplier:1/zoom}),n+'.'+(f==='jpeg'?'jpg':'png'));
  toast('Descarga lista')});

/* ---------- Inicio: recuperar diseño guardado ---------- */
try{
  const d=JSON.parse(localStorage.getItem('verdi-design'));
  if(d){
    W=d.w; H=d.h; $('#title').value=d.title\vert{}\vert{}$('#title').value;
    canvas.setDimensions({width:W, height:H});
    load(d.json,()=>{hist=[d.json];hi=0;buttons();fit();toast('Diseño recuperado')});
  }else{fit();snap()}
}catch(e){fit();snap()}
buttons();
</script>
</body>
</html>
